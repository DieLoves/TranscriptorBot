name: transcriptbot

x-app: &app
  image: transcriptbot-app:audit
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment:
    TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api:8081
    SQLITE_PATH: /data/transcriptbot.sqlite3
    WORK_DIR: /work/jobs
    TELEGRAM_FILES_DIR: /telegram
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:mode=1777,size=256m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 2g
  cpus: 2
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  bot:
    <<: *app
    command: [bot]
    mem_limit: 512m
    healthcheck:
      test: [CMD, transcriptbot, healthcheck, --service, bot]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    depends_on:
      telegram-bot-api:
        condition: service_started
    volumes:
      - data:/data
      - work:/work
      - telegram:/telegram:ro
    networks: [backend]

  worker:
    <<: *app
    command: [worker]
    healthcheck:
      test: [CMD, transcriptbot, healthcheck, --service, worker]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    depends_on:
      telegram-bot-api:
        condition: service_started
    volumes:
      - data:/data
      - work:/work
      - telegram:/telegram
    networks: [backend, egress]

  telegram-bot-api:
    image: transcriptbot-bot-api:audit
    build:
      context: .
      dockerfile: deploy/Dockerfile.bot-api
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - telegram:/telegram
    networks: [backend, egress]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1', 8081), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
  work:
  telegram:

networks:
  backend:
    internal: true
  egress:
