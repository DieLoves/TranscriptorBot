[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "transcriptbot"
version = "0.1.0"
description = "Telegram transcription bot using Groq"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram==3.31.0",
  "groq==1.7.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "yt-dlp[default]==2026.8.19",
]

[project.scripts]
transcriptbot = "transcriptbot.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# The user interface and operator diagnostics are intentionally in Russian.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["transcriptbot"]
